# Example runtime configuration.
# LEAN cloud is the primary research engine; local Python remains the parity oracle.

environment: local
trading_mode: backtest
primary_engine: lean_cloud
parity_oracle: local_python
log_level: INFO

paths:
  data_dir: ./data
  lean_workspace_dir: ./lean-workspace
  lean_data_dir: ./lean-workspace/data
  reports_dir: ./reports
  logs_dir: ./logs
  models_dir: ./models

features:
  ml_enabled: false
  historical_paper_replay_enabled: false
  automatic_data_download_enabled: false
  optimization_enabled: false
  live_trading_enabled: false
  monitoring_enabled: false
