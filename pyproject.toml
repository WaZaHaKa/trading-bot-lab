[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-lab"
version = "0.3.0"
description = "Research-first trading bot lab with strict risk guardrails."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "trading-bot-lab owner" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]
research = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.scripts]
trading-bot-lab = "trading_bot_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".pytest*", ".uv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"lean/algorithms/**/main.py" = ["F403", "F405", "I001"]
"lean-workspace/Strategies/**/main.py" = ["F403", "F405", "I001"]
